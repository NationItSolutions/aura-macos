name: Aura
options:
  bundleIdPrefix: com.nationit
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: es
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Aura:
    type: application
    platform: macOS
    sources:
      - path: Aura
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_NAME: Aura
        PRODUCT_BUNDLE_IDENTIFIER: com.nationit.aura
        INFOPLIST_FILE: Aura/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Aura/Resources/Aura.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
  AuraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AuraTests
    dependencies:
      - target: Aura
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nationit.aura.tests
schemes:
  Aura:
    build:
      targets:
        Aura: all
        AuraTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - AuraTests
